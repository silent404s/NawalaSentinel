<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NawalaSentinel — Multi-Operator Domain Block Monitor{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="shortcut icon" href="/static/img/icon.png">
</head>

<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="nav-container">
            <div class="brand-wrapper">
                <a href="/" class="brand-logo">
                    <img src="/static/img/icon.png" alt="NawalaSentinel" class="brand-img">
                    <span>NawalaSentinel</span>
                    <span class="brand-badge">PRO</span>
                </a>

                <div class="system-status-indicator" title="Mesin pemeriksa latar belakang berjalan otomatis">
                    <span class="status-dot-pulse"></span>
                    <span>Engine Active</span>
                    <span id="headerCountdown"
                        style="font-family: var(--font-mono); font-size: 0.68rem; opacity: 0.85; margin-left: 2px;"></span>
                </div>
            </div>

            <!-- Mobile Menu Toggle Button -->
            <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menu Navigasi">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <!-- Main Navigation Menu -->
            <nav class="nav-menu" id="navMenu">
                <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    Dashboard
                </a>
                <a href="/domains" class="nav-link {% if active_page == 'domains' %}active{% endif %}">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                        </path>
                    </svg>
                    Kelola Domain
                </a>
                <a href="/logs" class="nav-link {% if active_page == 'logs' %}active{% endif %}">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Riwayat Status
                </a>
                <a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    Pengaturan
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>NawalaSentinel Pro &copy; 2026 &mdash; Enterprise Multi-Operator ISP Block Monitor (Telkomsel, XL, Tri, IM3)
        </p>
    </footer>

    <script src="/static/js/main.js"></script>
</body>

</html>
